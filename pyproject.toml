[project]
name = "birr"
version = "0.1.0"
description = "Voice-first birr cash assistant for blind users, built on SAM 3.1 and Muse Spark Open"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"birr/read/prompt.py" = ["E501"]  # the reader prompt lines
"birr/lab.py" = ["E501"]  # lab request/response literals
