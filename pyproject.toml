[project]
name = "birr"
version = "0.1.0"
description = "Voice-first birr cash assistant for blind users, built on SAM 3.1 and Muse Spark Open"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Spoken Amharic and Oromo with Meta MMS-TTS on CPU (birr/voice/mms.py). Without it the backend
# still writes the same text in every language and the app speaks it with the phone's voice.
tts = [
    "numpy>=2.0",
    "torch>=2.6",
    "transformers>=4.50",
    "uroman>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # modal_sam/ is not part of the birr package

[tool.ruff.lint.per-file-ignores]
"birr/read/prompt.py" = ["E501"]  # the reader prompt lines
"birr/lab.py" = ["E501"]  # lab request/response literals
"birr/voice/templates.py" = ["E501"]  # Amharic and Oromo sentences

# CPU-only PyTorch on Linux (the box has no GPU): the default PyPI wheel pulls CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
